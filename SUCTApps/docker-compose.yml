#version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ["npm", "start"]
    depends_on:
      - frontend

  frontend:
    image: node:16
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: ["npm", "start"]
    environment:
      - CHOKIDAR_USEPOLLING=true # Needed for file change detection in Docker
